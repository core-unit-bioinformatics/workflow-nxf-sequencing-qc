lint:
  files_exist:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-sequencingqc_logo_light.png
    - docs/images/nf-core-sequencingqc_logo_light.png
    - docs/images/nf-core-sequencingqc_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml
  files_unchanged:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-sequencingqc_logo_light.png
    - docs/images/nf-core-sequencingqc_logo_light.png
    - docs/images/nf-core-sequencingqc_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/CONTRIBUTING.md
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
  multiqc_config:
    - report_comment
  nextflow_config:
    - manifest.name
    - manifest.homePage
nf_core_version: 4.2.2
repository_type: pipeline
template:
  author: Kai Horny
  description: Quality control for short-read sequencing runs (panels, exomes, genomes).
  force: false
  is_nfcore: false
  name: sequencingqc
  org: core-unit-bioinformatics
  outdir: .
  skip_features:
    - fastqc
    - gpu
  version: 1.0.0
