# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "fingerprint_database_report"
description: |
  Report the fingerprint check of this run: an overview (haplotype map,
  database checked, replaced fingerprints, comparison counts, updated
  database), the fingerprint of each sample (haplotype blocks with reads, self
  LOD, SUITABLE / INSUFFICIENT / NO_COVERAGE) and the comparisons with
  fingerprints of other sequencing runs classified by LOD score, as tables and
  MultiQC custom content. Reads VCFs with PyVCF and checks every input for
  consistency.
keywords:
  - fingerprint
  - crosscheck
  - sample identity
  - qc
tools:
  - "fingerprint_database_report.py":
      description: "exomeqc script (bin/) that summarises the fingerprint check and classifies comparisons with other runs by LOD score"
      homepage: "https://github.com/core-unit-bioinformatics/workflow-nxf-exomeqc"
      licence: ["MIT"]
      identifier: ""
input:
  - - meta:
        type: map
        description: Run-level metadata map, e.g. `[ id:'fingerprint_database' ]`
    - run_samples:
        type: file
        description: TSV with the columns fingerprint_id, sample, runid, bam (BAM file name) for every sample of this run
        pattern: "*.tsv"
    - fingerprints:
        type: file
        description: Fingerprint VCFs of this run (Picard ExtractFingerprint), staged as `fingerprints/*`
        pattern: "*.vcf.gz"
    - haplotype_map:
        type: file
        description: Picard haplotype map (text format)
        pattern: "*.txt"
    - run_crosscheck:
        type: file
        description: CrosscheckFingerprints metrics of this run's BAMs against each other (CROSSCHECK_BY FILE), for the self LOD of each sample
        pattern: "*.crosscheck_metrics.txt"
    - database:
        type: file
        description: Updated fingerprint database (multi-sample VCF); only its header is read
        pattern: "*.vcf.gz"
    - database_check:
        type: file
        description: Check result of the given database (metric, value) from CHECK_FINGERPRINT_DATABASE; `[]` without a database
        pattern: "*_check.tsv"
    - database_samples:
        type: file
        description: Fingerprints of the given database with action keep or replace, from CHECK_FINGERPRINT_DATABASE; `[]` without a database
        pattern: "*_samples.tsv"
    - database_crosscheck:
        type: file
        description: CrosscheckFingerprints metrics of this run (INPUT) against the kept database fingerprints (SECOND_INPUT), CROSSCHECK_BY SAMPLE; `[]` if no fingerprint was kept
        pattern: "*.crosscheck_metrics.txt"
output:
  matches:
    - - meta:
          type: map
          description: Run-level metadata map
      - "*_matches.tsv":
          type: file
          description: Reported comparisons with other runs (sample, runid, database_sample, database_runid, status, LOD scores)
          pattern: "*_matches.tsv"
  fingerprints:
    - - meta:
          type: map
          description: Run-level metadata map
      - "*_fingerprints.tsv":
          type: file
          description: Fingerprint of each sample of this run (haplotype blocks with reads, mean depth, self LOD, status)
          pattern: "*_fingerprints.tsv"
  summary:
    - - meta:
          type: map
          description: Run-level metadata map
      - "*_summary.tsv":
          type: file
          description: Counts of samples, fingerprints, comparisons and classes (metric, value)
          pattern: "*_summary.tsv"
  overview:
    - - meta:
          type: map
          description: Run-level metadata map
      - "*_overview_mqc.html":
          type: file
          description: MultiQC custom content section "Fingerprint check: overview"
          pattern: "*_overview_mqc.html"
  multiqc:
    - - meta:
          type: map
          description: Run-level metadata map
      - "*_matches_mqc.{tsv,html}":
          type: file
          description: MultiQC custom content; a table when comparisons are reported, otherwise an HTML note
          pattern: "*_matches_mqc.{tsv,html}"
  versions_python:
    - - ${task.process}:
          type: string
          description: The name of the process
      - python:
          type: string
          description: The name of the tool
      - python3 --version | sed 's/Python //':
          type: eval
          description: The expression to obtain the version of the tool
  versions_pyvcf3:
    - - ${task.process}:
          type: string
          description: The name of the process
      - pyvcf3:
          type: string
          description: The name of the tool
      - python3 -c 'import vcf; print(vcf.VERSION)':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - python:
          type: string
          description: The name of the tool
      - python3 --version | sed 's/Python //':
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - pyvcf3:
          type: string
          description: The name of the tool
      - python3 -c 'import vcf; print(vcf.VERSION)':
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@kai"
maintainers:
  - "@kai"
