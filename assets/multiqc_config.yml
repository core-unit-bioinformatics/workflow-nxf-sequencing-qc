title: Sequencing QC
subtitle: Institute for Pathology, University clinics Düsseldorf
report_comment: >-
  This report has been generated by the <a
  href="https://github.com/core-unit-bioinformatics/workflow-nxf-sequencing-qc/releases/tag/1.0.0"
  target="_blank">core-unit-bioinformatics/workflow-nxf-sequencing-qc</a> analysis pipeline.
custom_data:
  dragen_cnv_qc_metrics:
    section_name: DRAGEN CNV QC Metrics
    description: >-
      DRAGEN CNV caller metrics and QC status generated by analyze_cnv_metrics.R
      (DRAGEN output only). Table colors
      and ranges are configured in this MultiQC file.
    plot_type: table
    pconfig:
      id: dragen_cnv_qc_metrics_table
      title: DRAGEN CNV QC Metrics
      col1_header: Sample
      sort_rows: true
      # columns listed under 'headers' come first, in this order; all other
      # columns follow in file order
      only_defined_headers: false
    headers:
      QC_STATUS: {}
      QC_FAIL_REASONS: {}
      NORMAL_SEX: {}
      TUMOR_SEX: {}
      EstimatedTumorPurity:
        title: Tumor purity
        description: DRAGEN EstimatedTumorPurity
        format: '{:,.0%}'
        min: 0
        max: 1
        scale: RdYlGn
      PMAD:
        format: '{:,.3f}'
      Coverage MAD:
        format: '{:,.3f}'
      DiploidCoverage:
        format: '{:,.1f}'
      HomozygosityIndex:
        format: '{:,.3f}'
      OutlierBafFraction:
        format: '{:,.3f}'
      ModelSource: {}
  dragen_cnv_qc_purcov_maxmodel:
    section_name: 'DRAGEN CNV: Purity/Coverage Model'
    description: >-
      Maximum normalized log-likelihood by purity across all samples. For each
      sample, the maximum value is shifted to 0.
    plot_type: linegraph
    pconfig:
      id: dragen_cnv_qc_purcov_line_all_samples
      title: "DRAGEN CNV: Purity model (all samples, normalized)"
      xlab: Purity
      ylab: logL - sample max(logL)
      xmin: 0
      xmax: 1
      tt_label: "{point.x:.3f}: {point.y:.3f}"
report_section_order:
  grz_qc:
    order: 1000
  grz_qc_redundant:
    order: 990
  bclconvert:
    order: 980
  interop:
    order: 970
  exomeqc_fingerprint_overview:
    order: 962
  exomeqc_fingerprint_qc:
    order: 961
  picard:
    order: 960
  exomeqc_fingerprint_database:
    order: 955
  exomeqc_vaf_histogram:
    order: 950
  fastq_screen:
    order: 940
  DRAGEN:
    order: 930
  dragen-fastqc:
    order: 920
  dragen_cnv_qc_metrics:
    order: 910
  dragen_cnv_qc_purcov_maxmodel:
    order: 900
  fastqc:
    order: 890
  fastp:
    order: 880
  bcftools:
    order: 870
  vep:
    order: 860
  cio-abcd-variantinterpretation-methods-description:
    order: -10
  cio-abcd-variantinterpretation-summary:
    order: -20
  BfArM-MVH-GRZ_QC_Workflow-summary:
    order: -30
  core-unit-bioinformatics-workflow-nxf-sequencing-qc-methods-description:
    order: -40
  software_versions:
    order: -50
  core-unit-bioinformatics-workflow-nxf-sequencing-qc-summary:
    order: -60
export_plots: true
extra_fn_clean_trim:
  - .hard-filtered
  - .mapping_metrics
  - .ploidy_estimation_metrics
  - .vc_metrics
  - .cnv-noLOH.vcf.gz
  - .nonredundant
  - .nonredundant.mosdepth.summary.txt
  - .redundant
  - .redundant.mosdepth.summary.txt
ignore_images: false
fn_ignore_dirs:
  - .nextflow
  - .nextflow*
sp:
  # the crosscheck of this run against the fingerprint database is reported as
  # exomeqc_fingerprint_database table; it must not enter the Picard heatmap
  picard/crosscheckfingerprints:
    exclude_fn: "*fingerprint_database.crosscheck_metrics.txt"
  dragen_cnv_qc_metrics:
    fn: "*cnv-metrics.csv"
  dragen_cnv_qc_purcov_maxmodel:
    fn: "*purcov_maxmodel_lineplot.json"
disable_version_detection: true
